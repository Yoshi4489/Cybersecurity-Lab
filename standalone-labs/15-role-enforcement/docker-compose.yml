name: cybersecurity-lab-15-role-enforcement
services:
  toolbox:
    build:
      context: ../_shared/toolbox
    command: ["sleep", "infinity"]
    hostname: toolbox
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=8m,mode=0755
    volumes:
      - ./smoke.sh:/opt/lab/smoke.sh:ro
    networks:
      role_net:
        ipv4_address: 172.31.15.10
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    mem_limit: 192m
    cpus: "0.50"
    depends_on:
      role-api:
        condition: service_healthy
  role-api:
    build:
      context: ./target
    hostname: role-api
    environment:
      FLAG_L15_MATRIX: "${FLAG_L15_MATRIX:?run via standalone-labctl}"
      FLAG_L15_REMEDIATION: "${FLAG_L15_REMEDIATION:?run via standalone-labctl}"
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks:
      role_net:
        ipv4_address: 172.31.15.20
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 96m
    cpus: "0.35"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 15
networks:
  role_net:
    internal: true
    ipam:
      config:
        - subnet: 172.31.15.0/24
