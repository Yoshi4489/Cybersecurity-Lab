name: cybersecurity-lab-01-network-triage

services:
  toolbox:
    build:
      context: ../_shared/toolbox
    command: ["sleep", "infinity"]
    hostname: toolbox
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=8m,mode=0755
    volumes:
      - ./smoke.sh:/opt/lab/smoke.sh:ro
    networks:
      triage_net:
        ipv4_address: 172.28.1.10
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 192m
    cpus: "0.50"
    depends_on:
      triage-node:
        condition: service_healthy

  triage-node:
    build:
      context: ./target
    hostname: triage-node
    environment:
      FLAG_L01_NETWORK_BASELINE: "${FLAG_L01_NETWORK_BASELINE:?run via standalone-labctl}"
      FLAG_L01_SERVICE_BEACON: "${FLAG_L01_SERVICE_BEACON:?run via standalone-labctl}"
      FLAG_L01_OPERATOR_CONSOLE: "${FLAG_L01_OPERATOR_CONSOLE:?run via standalone-labctl}"
      FLAG_L01_TRIAGE_PROOF: "${FLAG_L01_TRIAGE_PROOF:?run via standalone-labctl}"
    expose:
      - "7070"
      - "8080"
      - "9090"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      triage_net:
        ipv4_address: 172.28.1.20
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 96m
    cpus: "0.35"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 15

networks:
  triage_net:
    internal: true
    ipam:
      config:
        - subnet: 172.28.1.0/24
