name: cybersecurity-lab-10-message-recovery
services:
  toolbox:
    build:
      context: ../_shared/toolbox
    command: ["sleep", "infinity"]
    hostname: toolbox
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=8m,mode=0755
    volumes:
      - ./smoke.sh:/opt/lab/smoke.sh:ro
    networks:
      message_net:
        ipv4_address: 172.31.10.10
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    mem_limit: 192m
    cpus: "0.50"
    depends_on:
      message-vault:
        condition: service_healthy
  message-vault:
    build:
      context: ./target
    hostname: message-vault
    environment:
      FLAG_L10_BASE64: "${FLAG_L10_BASE64:?run via standalone-labctl}"
      FLAG_L10_HEX: "${FLAG_L10_HEX:?run via standalone-labctl}"
      FLAG_L10_ROT13: "${FLAG_L10_ROT13:?run via standalone-labctl}"
      FLAG_L10_MD5: "${FLAG_L10_MD5:?run via standalone-labctl}"
      FLAG_L10_MESSAGE: "${FLAG_L10_MESSAGE:?run via standalone-labctl}"
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks:
      message_net:
        ipv4_address: 172.31.10.20
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 96m
    cpus: "0.35"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      # Leave time for Python imports on a CPU-limited Docker Desktop container.
      timeout: 5s
      retries: 15
networks:
  message_net:
    internal: true
    ipam:
      config:
        - subnet: 172.31.10.0/24
